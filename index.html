<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>NEOXSTEALTH | Full Access</title>
    <style>
        :root {
            --bg: #020202;
            --matrix-green: #00ff41;
            --interface-red: #ff003c;
            --panel-bg: #0a0a0a;
            --text-dim: #888;
        }

        body {
            margin: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            background: var(--bg);
            color: var(--matrix-green);
            display: grid;
            grid-template-columns: 1fr 400px; /* Bredere zijbalk voor bio + chat */
            height: 100vh;
            overflow: hidden;
        }

        /* --- Hoofdsectie (Links) --- */
        main {
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            height: 100vh;
        }

        .web-frame {
            flex-grow: 1; /* Neemt nu bijna alle verticale ruimte in */
            background: #000;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: contrast(1.1);
        }

        /* --- Fotoalbum (Onderaan Main) --- */
        .photo-album {
            height: 130px;
            background: #080808;
            border-top: 2px solid var(--matrix-green);
            padding: 10px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            align-items: center;
        }

        .album-item {
            flex: 0 0 110px;
            height: 100px;
            border: 1px solid #333;
            cursor: pointer;
            transition: 0.2s;
        }

        .album-item:hover { border-color: var(--matrix-green); transform: scale(1.05); }
        .album-item img { width: 100%; height: 100%; object-fit: cover; }

        /* --- Zijpaneel (Rechts) --- */
        .sidebar {
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #222;
        }

        .status-bar {
            background: #111;
            padding: 10px;
            border-bottom: 1px solid #222;
        }

        .name-editor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        #agentNameInput {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--matrix-green);
            padding: 5px;
            font-family: inherit;
            outline: none;
            width: 60%;
        }

        .stealth-bio {
            padding: 10px;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-bottom: 1px solid #222;
            line-height: 1.3;
        }

        #chat-window {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.8rem;
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        .msg { margin-bottom: 8px; border-left: 2px solid #333; padding-left: 8px; }
        .msg.agent .user-name { color: var(--matrix-green); font-weight: bold; }
        
        /* Gifts */
        .gift-console {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding: 10px;
            background: #080808;
        }

        .gift-btn {
            background: #111;
            border: 1px solid #333;
            color: #888;
            padding: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: inherit;
        }

        .gift-btn:hover { color: var(--matrix-green); border-color: var(--matrix-green); }

        .input-wrap { padding: 15px; background: #000; }
        input#stealthInput { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--matrix-green); color: var(--matrix-green); outline: none; padding: 5px; }

        /* Lightbox */
        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; cursor: pointer; }
        #lightbox img { max-width: 85%; max-height: 85%; border: 2px solid var(--matrix-green); }
    </style>
</head>
<body>

<main>
    <div class="web-frame">
        <iframe src="https://neoxchat.com"></iframe>
    </div>

    <section class="photo-album">
        <div class="album-item" onclick="openLightbox('cute.png')">
            <img src="cute.png" alt="Cute">
        </div>
        <div class="album-item" onclick="openLightbox('HSH.png')">
            <img src="HSH.png" alt="HSH">
        </div>
        <div class="album-item" onclick="openLightbox('huil.png')">
            <img src="huil.png" alt="Huil">
        </div>
    </section>
</main>

<aside class="sidebar">
    <div class="status-bar">
        <div class="name-editor">
            <label>AGENT_ID:</label>
            <input type="text" id="agentNameInput" value="NEOX_GHOST" maxlength="15">
        </div>
        <div style="font-size: 0.65rem; color: var(--interface-red);">SYSTEM_STATUS: STEALTH_ACTIVE</div>
    </div>

    <div class="stealth-bio">
        <b>PROTOCOL: NEOXSTEALTH</b><br>
        Ingebroken op Neoxchat. Identiteit verborgen. Geen gezichten, alleen data. 
        Gifts worden direct naar de buffer gestuurd.
    </div>

    <div id="chat-window"></div>

    <div class="gift-console">
        <button class="gift-btn" onclick="gift('Wiet')">WIET</button>
        <button class="gift-btn" onclick="gift('Bier')">BIER</button>
        <button class="gift-btn" onclick="gift('Trudy')">TRUDY</button>
        <button class="gift-btn" onclick="gift('Angel')">ANGEL</button>
        <button class="gift-btn" onclick="gift('Jill')">JILL</button>
        <button class="gift-btn" onclick="gift('Virgil')">VIRGIL</button>
        <button class="gift-btn" onclick="gift('Johanwagenaararkade')">JWA_ARKADE</button>
    </div>

    <div class="input-wrap">
        <input type="text" id="stealthInput" placeholder="> Typ bericht..." autocomplete="off">
    </div>
</aside>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lbImg" src="">
</div>

<script>
    const chat = document.getElementById('chat-window');
    const input = document.getElementById('stealthInput');
    const nameIn = document.getElementById('agentNameInput');

    function log(user, text, type='') {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerHTML = `<span class="user-name">${user}:</span> ${text}`;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    function gift(n) { log(nameIn.value, `GIFT_INJECTED: [${n}]`, 'agent'); }

    input.addEventListener('keypress', (e) => {
        if(e.key === 'Enter' && input.value !== "") {
            log(nameIn.value, input.value, 'agent');
            input.value = "";
            setTimeout(() => log('NEOX-BOT', 'Bericht gecodeerd verzonden.'), 600);
        }
    });

    function openLightbox(src) {
        document.getElementById('lbImg').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    // Welkomstbericht
    window.onload = () => log('SYSTEM', 'Verbinding met Neoxchat stabiel.');
</script>

</body>
</html>
